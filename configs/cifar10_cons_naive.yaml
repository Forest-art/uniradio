seed: 42

experiment:
  name: cifar10_cons1_naive
  group: joint_naive

output:
  root: runs

data:
  dataset: cifar10
  root: /path/to/cifar10
  image_size: 32
  batch_size: 128
  num_workers: 8
  download: true
  val_from_train: false
  val_ratio: 0.1
  use_fake_data: false
  fake_train_size: 4096
  fake_eval_size: 1024

model:
  backbone: resnet18
  pretrained: false
  freeze_backbone: false
  txt_dim: 256
  rec_dim: 256
  decoder_hidden_dim: 512
  recon_size: 32

text:
  prompt_templates:
    - "a photo of a {class}"
  temperature: 0.07

train:
  mode: joint
  steps: 5000
  lambda_txt: 1.0
  lambda_rec: 1.0
  lambda_cons: 0.1
  lambda_sup: 0.0
  strategy: naive
  shared_params: backbone

consistency:
  enabled: true
  two_view: true
  aug_strength: medium
  target: txt_head
  loss_type: cosine
  lambda_cons: 0.1
  merge_into_understanding: false
  recon_target_source: view1

supcon:
  enabled: false
  two_view: true
  aug: medium
  lambda: 0.5
  tau: 0.1
  embed: txt
  merge_into_understanding: true

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4

log:
  every: 20
  cos_every: 20
  save_every: 1000
  eval_every: 1000

eval:
  split: test
  batch_size: 256
  max_batches: 50
  save_recon_samples: true
  sample_images: 8

sweep:
  mode: joint_naive
  seeds: [42, 43, 44]

accelerate:
  mixed_precision: "no"
