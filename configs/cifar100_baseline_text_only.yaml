seed: 42

experiment:
  name: cifar100_baseline_text_only
  group: text_only

output:
  root: runs

data:
  dataset: cifar100
  root: /project/peilab/luxiaocheng/projects/DSGA/data/cifar100
  image_size: 32
  batch_size: 128
  num_workers: 8
  download: true
  val_from_train: false
  val_ratio: 0.1
  use_fake_data: false
  fake_train_size: 4096
  fake_eval_size: 1024

model:
  backbone: resnet18
  pretrained: false
  freeze_backbone: false
  txt_dim: 256
  rec_dim: 256
  decoder_hidden_dim: 512
  recon_size: 32

text:
  prompt_templates:
    - "a photo of a {class}"
  temperature: 0.07

train:
  mode: text_only
  steps: 5000
  lambda_txt: 1.0
  lambda_rec: 1.0
  grad_strategy: naive
  shared_params: backbone

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4

log:
  every: 20
  cos_every: 20
  save_every: 1000
  eval_every: 1000

eval:
  split: test
  batch_size: 256
  max_batches: 50
  save_recon_samples: true
  sample_images: 8

accelerate:
  mixed_precision: "no"
