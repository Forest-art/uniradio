seed: 42

experiment:
  name: cifar10_smoke
  group: joint_pcgrad

output:
  root: runs

data:
  dataset: cifar10
  root: /path/to/cifar10
  image_size: 32
  batch_size: 128
  num_workers: 8
  download: true
  val_from_train: false
  val_ratio: 0.1
  use_fake_data: false
  fake_train_size: 4096
  fake_eval_size: 1024

model:
  backbone: resnet18           # resnet18 | vit_small
  pretrained: false
  freeze_backbone: false
  txt_dim: 256
  rec_dim: 256
  decoder_hidden_dim: 512
  recon_size: 32

text:
  prompt_templates:
    - "a photo of a {class}"
  temperature: 0.07

train:
  mode: joint                  # joint | text_only | recon_only
  steps: 200
  lambda_txt: 1.0
  lambda_rec: 1.0
  strategy: pcgrad             # naive | pcgrad | cagrad
  shared_params: backbone      # backbone | all

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4

log:
  every: 20
  cos_every: 20
  save_every: 200
  eval_every: 200

eval:
  split: test
  batch_size: 256
  max_batches: 50
  save_recon_samples: true
  sample_images: 8

accelerate:
  mixed_precision: "no"
