seed: 42

experiment:
  name: smoke
  group: joint_conflict

output:
  root: runs

data:
  data_root: /path/to/imagenet
  data_format: auto        # auto | imagefolder | hf_disk
  hf_load_from_disk: null  # e.g. /path/to/imagenet_hf_saved
  hf_split_train: train
  hf_split_val: validation
  hf_image_key: image
  hf_label_key: label
  class_names_file: null
  image_size: 224
  num_workers: 8

radio:
  code_root: /project/peilab/luxiaocheng/projects/RADIO
  ckpt: /path/to/radio_checkpoint.pth.tar
  clip_adaptor: clip
  dino_adaptor: dino_v2
  freeze_trunk: true
  allow_fallback: true
  output_dim:
    clip: 1024
    dino: 1024

lora:
  enable: true
  rank: 8
  alpha: 16
  target_modules:
    - "blocks\\..*\\.attn\\.qkv"
    - "blocks\\..*\\.attn\\.proj"
    - "blocks\\..*\\.mlp\\.fc1"
    - "blocks\\..*\\.mlp\\.fc2"

optimize:
  decoder: true
  projections: true
  model_when_no_lora: false

text:
  clip_model: ViT-B-32
  clip_pretrained: openai
  prompt_templates:
    - "a photo of a {class}"
  temperature: 0.07
  batch_size: 256

decoder:
  hidden_dim: 1024
  feature_target_dim: 1024
  pixel_size: 64
  token_dropout: 0.0
  noise_tau: 0.8

recon:
  target: feature_recon  # feature_recon | pixel_recon
  pixel_loss: mse        # mse | huber
  huber_delta: 1.0

train:
  steps: 1000
  batch_size: 32
  lambda_txt: 1.0
  lambda_rec: 1.0
  strategy: conflict_aware  # naive | conflict_aware

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4

log:
  every: 10
  cos_every: 10
  save_every: 200
  eval_every: 200

eval:
  batch_size: 64
  max_batches: 20
  use_lpips: false
