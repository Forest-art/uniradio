seed: 42

experiment:
  name: imagenet_dino_rae_stage1_full
  group: stage1_rae_full

output:
  root: runs

accelerate:
  mixed_precision: bf16

data:
  data_root: /path/to/imagenet
  data_format: auto          # auto | imagefolder | hf_disk
  hf_load_from_disk: null    # e.g. /path/to/imagenet_hf_saved
  hf_split_train: train
  hf_split_val: validation
  hf_image_key: image
  hf_label_key: label
  class_names_file: null
  image_size: 224
  num_workers: 8

model:
  num_classes: 1000
  dino_variant: vit_base_patch14_reg4_dinov2   # 推荐 DINOv2 with registers
  pretrained: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_last_n_blocks: 0
  decoder_dim: 512
  decoder_depth: 8
  decoder_heads: 16
  decoder_mlp_ratio: 4.0
  decoder_drop_rate: 0.0
  decoder_noise_tau: 0.8
  use_grad_checkpointing: false

recon:
  pixel_loss: l1
  huber_delta: 1.0

train:
  steps: 20000
  batch_size: 64
  clip_grad: 0.0
  ema_decay: 0.9978

optim:
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0

scheduler:
  type: cosine
  warmup_steps: 1000
  final_lr: 2.0e-5

gan:
  enable: true
  disc:
    arch:
      dino_ckpt_path: /path/to/RAE/models/discs/dino_vit_small_patch8_224.pth
      ks: 9
      norm_type: bn
      using_spec_norm: true
      recipe: S_8
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_steps: 1000
      final_lr: 2.0e-5
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start_epoch: 8
    disc_upd_start_epoch: 6
    lpips_start_epoch: 0
    max_d_weight: 10000.0
    disc_updates: 1

rae_integration:
  code_root: /project/peilab/luxiaocheng/projects/RAE

log:
  every: 20
  eval_every: 1000
  save_every: 1000

eval:
  batch_size: 64
  max_batches: 50
  use_ema: true
  use_official_rae_eval: true
  # reference_npz_path: /path/to/imagenet_val_224_or_256.npz
  num_samples: 50000
  metric_batch_size: 128
  metrics: [psnr, ssim, rfid]
